name: Path to 95 gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p95-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-checkout-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          enable-cache: true
      - run: ./scripts/p95-secret-scan.sh
      - run: ./scripts/phase5-check.sh
      - name: Audit the locked runtime environment
        run: uv run pip-audit --progress-spinner off
      - name: Verify reviewed defects remain explicit regression locks
        run: |
          output="$(uv run pytest -q tests/p95)"
          printf '%s\n' "$output"
          grep -q '3 xfailed' <<<"$output"

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pinned actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
