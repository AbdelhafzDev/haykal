name: P95.4 shipped wheel acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p95-4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-once:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.17"
          enable-cache: true
      - name: Build the promoted wheel and immutable acceptance bundle once
        run: ANDROID_SDK_ROOT="$ANDROID_HOME" ./scripts/p95-4-build-bundle.sh release-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p95-4-release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 14

  clean-android:
    needs: build-once
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p95-4-release-bundle
          path: release-bundle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: >-
            ANDROID_SDK_ROOT="$ANDROID_HOME"
            ANDROID_SERIAL=emulator-5554
            P95_API_LEVEL=${{ matrix.api-level }}
            ./scripts/p95-4-wheel-acceptance.sh
            "$GITHUB_WORKSPACE/release-bundle"
            "$GITHUB_WORKSPACE/reports/p95-4/api-${{ matrix.api-level }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: p95-4-api-${{ matrix.api-level }}
          path: reports/p95-4/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 14

  same-wheel-attestation:
    if: always()
    needs: clean-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: p95-4-api-*
          path: matrix-evidence
      - name: Prove both API levels used the identical promoted wheel
        run: >-
          python scripts/p95-4-verify-matrix.py
          matrix-evidence/p95-4-api-34
          matrix-evidence/p95-4-api-35
          --output matrix-evidence/same-wheel-attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p95-4-same-wheel-attestation
          path: matrix-evidence/same-wheel-attestation.json
          if-no-files-found: error
          retention-days: 14
